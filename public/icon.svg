<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Premium Obsidian Emerald Radial Background -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="45%" stop-color="#022c22"/>
      <stop offset="85%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Metallic Pure Gold Gradient for Currency Coin & Rim -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Emerald Glow Accent Gradient -->
    <linearGradient id="emeraldGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Metallic Card Surface -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Golden Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- High Definition Multi-layer Shadow -->
    <filter id="hdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>

    <!-- Glowing Chart Line Filter -->
    <filter id="chartGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Frame with Full-bleed Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Outer Metallic Border Accent -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#goldRim)" stroke-width="5" opacity="0.85"/>
  <rect x="18" y="18" width="476" height="476" rx="102" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.3"/>

  <!-- Subtle Geometric Tech Concentric Rings -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#34d399" stroke-width="1" opacity="0.1"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.08"/>

  <!-- Main Luxury Wallet / Card Graphic -->
  <g filter="url(#hdShadow)">
    <!-- Metallic Card Surface -->
    <rect x="100" y="148" width="312" height="216" rx="32" fill="url(#cardGrad)" stroke="url(#goldRim)" stroke-width="2.5"/>
    
    <!-- Magnetic Dark Strip -->
    <rect x="100" y="190" width="312" height="40" fill="#090d16" opacity="0.95"/>

    <!-- EMV Gold Chip Accent -->
    <rect x="135" y="258" width="44" height="34" rx="8" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1"/>
    <line x1="157" y1="258" x2="157" y2="292" stroke="#92400e" stroke-width="1.5"/>
    <line x1="135" y1="275" x2="179" y2="275" stroke="#92400e" stroke-width="1.5"/>

    <!-- Ascending Financial Growth Line -->
    <path d="M 195 320 L 245 282 L 288 296 L 358 232 L 390 244" 
          fill="none" 
          stroke="url(#emeraldGlow)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#chartGlow)"/>
    
    <!-- Glowing Chart Peak Points -->
    <circle cx="358" cy="232" r="8" fill="#a7f3d0" stroke="#059669" stroke-width="2"/>
    <circle cx="390" cy="244" r="6" fill="#34d399"/>

    <!-- Golden Currency Badge Emblem ("R$") -->
    <g transform="translate(328, 132)">
      <circle cx="42" cy="42" r="48" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4" filter="url(#hdShadow)"/>
      <circle cx="42" cy="42" r="40" fill="none" stroke="#78350f" stroke-width="2" opacity="0.6"/>
      <text x="42" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#451a03" text-anchor="middle" letter-spacing="-1">R$</text>
    </g>
  </g>
</svg>
