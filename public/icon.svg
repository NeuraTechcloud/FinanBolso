<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium Obsidian Emerald Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Metallic Gold Coin Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Emerald Glow Accent Gradient -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Card Dark Metallic Surface -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Outer Golden/Emerald Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- High Definition Shadow -->
    <filter id="hdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Icon Shape with Rounded Squircle Corners -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="url(#borderGrad)" stroke-width="6" opacity="0.8"/>

  <!-- Subtle Concentric Aura Circles -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#34d399" stroke-width="2" opacity="0.12"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.1"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#34d399" stroke-width="1" opacity="0.08"/>

  <!-- Main Luxury Wallet / Card Component -->
  <g filter="url(#hdShadow)">
    <!-- Main Dark Card Surface -->
    <rect x="100" y="150" width="312" height="212" rx="32" fill="url(#cardGrad)" stroke="#334155" stroke-width="3"/>
    
    <!-- Magnetic / Decorative Strip -->
    <rect x="100" y="195" width="312" height="42" fill="#090d16" opacity="0.9"/>

    <!-- EMV Chip Accent -->
    <rect x="135" y="260" width="42" height="32" rx="8" fill="url(#goldGrad)"/>
    <line x1="156" y1="260" x2="156" y2="292" stroke="#92400e" stroke-width="1.5"/>
    <line x1="135" y1="276" x2="177" y2="276" stroke="#92400e" stroke-width="1.5"/>

    <!-- Dynamic Ascending Growth Trend Chart -->
    <path d="M 195 320 L 245 285 L 285 298 L 355 235 L 388 248" 
          fill="none" 
          stroke="url(#emeraldGlow)" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glowFilter)"/>
    
    <!-- Glowing Chart Peak Points -->
    <circle cx="355" cy="235" r="7" fill="#6ee7b7"/>
    <circle cx="388" cy="248" r="6" fill="#34d399"/>

    <!-- Premium Golden Currency Badge Emblem -->
    <g transform="translate(325, 140)">
      <circle cx="42" cy="42" r="46" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4" filter="url(#hdShadow)"/>
      <circle cx="42" cy="42" r="38" fill="none" stroke="#b45309" stroke-width="2" opacity="0.5"/>
      <text x="42" y="55" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#451a03" text-anchor="middle" letter-spacing="-1">R$</text>
    </g>
  </g>
</svg>
