<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FinanBolso - Controle Financeiro Pessoal VIP</title>
    <meta name="description" content="Aplicativo móvel completo para celular de controle financeiro com gráficos detalhados de gastos mensais, salvamento offline e exportação de dados." />
    <meta property="og:title" content="FinanBolso - Controle Financeiro Pessoal VIP" />
    <meta property="og:description" content="Aplicativo móvel completo para celular de controle financeiro com gráficos detalhados de gastos mensais, salvamento offline e exportação de dados." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#022c22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinanBolso" />
    
    <!-- Favicon & High Resolution PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icon.svg" color="#10b981" />

    <style>
      /* Preloader & Luxury Splash Screen Styling with Smooth Fade-out */
      body {
        margin: 0;
        background-color: #020617;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }

      .splash-container {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #064e3b 0%, #022c22 45%, #020617 90%);
        padding: 24px;
        box-sizing: border-box;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: auto;
        will-change: opacity, visibility;
      }

      .splash-container.fade-out {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }

      .splash-logo-wrapper {
        position: relative;
        width: 140px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 28px;
      }

      .splash-ring {
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        border: 2px stroke transparent;
        background: linear-gradient(135deg, rgba(52, 211, 153, 0.5), rgba(245, 158, 11, 0.5)) border-box;
        -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: destination-out;
        mask-composite: exclude;
        animation: spinRing 6s linear infinite;
      }

      .splash-aura {
        position: absolute;
        inset: -24px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.3) 0%, transparent 70%);
        animation: pulseAura 2.5s ease-in-out infinite alternate;
      }

      .splash-icon {
        width: 120px;
        height: 120px;
        border-radius: 32px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(16, 185, 129, 0.35);
        transform: scale(1);
        animation: floatLogo 3s ease-in-out infinite alternate;
      }

      .splash-title {
        font-size: 22px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
        text-align: center;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .splash-badge {
        font-size: 10px;
        font-weight: 800;
        background: rgba(16, 185, 129, 0.25);
        color: #6ee7b7;
        padding: 2px 8px;
        border-radius: 9999px;
        border: 1px solid rgba(16, 185, 129, 0.5);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .splash-subtitle {
        font-size: 12px;
        color: #94a3b8;
        margin-bottom: 36px;
        text-align: center;
      }

      .splash-progress-bar {
        width: 180px;
        height: 4px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }

      .splash-progress-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #10b981, #f59e0b, #34d399);
        border-radius: 9999px;
        animation: progressAnim 1.8s ease-in-out infinite;
      }

      @keyframes spinRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes pulseAura {
        from { opacity: 0.4; transform: scale(0.95); }
        to { opacity: 0.9; transform: scale(1.1); }
      }

      @keyframes floatLogo {
        from { transform: translateY(0px); }
        to { transform: translateY(-6px); }
      }

      @keyframes progressAnim {
        0% { left: -40%; width: 40%; }
        50% { left: 30%; width: 60%; }
        100% { left: 100%; width: 40%; }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <!-- React App Container -->
    <div id="root"></div>

    <!-- Premium Splash Preloader (Rendered outside root so it smoothly fades out over React) -->
    <div id="app-splash" class="splash-container">
      <div class="splash-logo-wrapper">
        <div class="splash-aura"></div>
        <div class="splash-ring"></div>
        <img src="/icon.svg" alt="FinanBolso Logo" class="splash-icon" />
      </div>

      <div class="splash-title">
        <span>FinanBolso</span>
        <span class="splash-badge">VIP</span>
      </div>
      <div class="splash-subtitle">Iniciando sistema de gestão financeira...</div>

      <div class="splash-progress-bar">
        <div class="splash-progress-fill"></div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
